<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Directory - Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fira Code', monospace;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            background: #000;
            overflow-x: hidden;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        .sound-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid #00ff66;
            color: #00ff66;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .sound-btn:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 20px #00ff66;
        }

        .terminal-window {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            background: rgba(0, 10, 5, 0.25);
            border: 1.5px solid #00ff66;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.6), inset 0 0 15px rgba(0, 255, 102, 0.2);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .terminal-header {
            background: rgba(0, 20, 10, 0.4);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1.5px solid #00ff66;
        }

        .terminal-buttons {
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-red { background: #ff5f56; box-shadow: 0 0 8px #ff5f56; }
        .dot-yellow { background: #ffbd2e; box-shadow: 0 0 8px #ffbd2e; }
        .dot-green { background: #27c93f; box-shadow: 0 0 8px #27c93f; }

        .terminal-title {
            color: #00ff66;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66;
        }

        .terminal-body {
            padding: 25px;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #00ff66;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66;
        }

        .script-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .script-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1.5px solid #00ff66;
            padding: 12px 16px;
            border-radius: 6px;
            transition: all 0.25s ease;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .script-item:hover {
            border-color: #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.8);
            background: rgba(0, 255, 102, 0.15);
        }

        .script-item a {
            color: #00ff66;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            word-break: break-all;
            text-shadow: 0 0 8px #00ff66;
        }

        .script-item a:hover {
            text-shadow: 0 0 15px #00ff66;
        }

        .del-btn {
            background: rgba(255, 50, 50, 0.25);
            border: 1.5px solid #ff4444;
            color: #ff6666;
            padding: 6px 12px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 700;
            transition: all 0.25s ease;
            text-shadow: 0 0 8px #ff4444;
        }

        .del-btn:hover {
            background: #ff4444;
            color: #fff;
            box-shadow: 0 0 20px #ff4444;
            text-shadow: none;
        }

        .nav-link {
            display: inline-block;
            margin-top: 20px;
            color: #00ff66;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            text-shadow: 0 0 10px #00ff66;
        }

        .nav-link:hover {
            text-shadow: 0 0 20px #00ff66;
        }
    </style>
</head>
<body>

    <button class="sound-btn" id="soundToggle" onclick="toggleSound()">🔇 Sound: OFF</button>

    <video autoplay loop muted playsinline id="bg-video">
        <source src="https://files.catbox.moe/qjz0ac.mp4" type="video/mp4">
    </video>

    <div class="terminal-window">
        <div class="terminal-header">
            <div class="terminal-buttons">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <div class="terminal-title">PUBLIC_DIRECTORY // HOSTED_SCRIPTS</div>
        </div>

        <div class="terminal-body">
            <h2>&gt; HOSTED SCRIPTS INDEX</h2>
            <div id="list" class="script-list">Loading repository contents...</div>
            <a href="/" class="nav-link">⬅️ [RETURN_TO_EDITOR]</a>
        </div>
    </div>

    <script>
        const video = document.getElementById('bg-video');
        const soundBtn = document.getElementById('soundToggle');

        function toggleSound() {
            if (video.muted) {
                video.muted = false;
                soundBtn.innerHTML = "🔊 Sound: ON";
            } else {
                video.muted = true;
                soundBtn.innerHTML = "🔇 Sound: OFF";
            }
        }

        document.body.addEventListener('click', function() {
            if (video.muted) {
                video.muted = false;
                soundBtn.innerHTML = "🔊 Sound: ON";
            }
        }, { once: true });

        const token = localStorage.getItem('admin_token');
        loadScripts();

        async function loadScripts() {
            const res = await fetch('/api/scripts/list');
            const data = await res.json();
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = '';

            if (!data.scripts || data.scripts.length === 0) {
                listDiv.innerHTML = '<p style="color: #00ff66; text-shadow: 0 0 8px #00ff66;">// No scripts found in directory.</p>';
                return;
            }

            data.scripts.forEach(script => {
                const deleteButton = token ? `<button class="del-btn" onclick="deleteScript('${script._id}')">Purge</button>` : '';
                
                listDiv.innerHTML += `
                    <div class="script-item">
                        <a href="/scripts/${script.filename}" target="_blank">/scripts/${script.filename}</a>
                        ${deleteButton}
                    </div>
                `;
            });
        }

        async function deleteScript(id) {
            if (!confirm("Are you sure you want to purge this script?")) return;
            await fetch(`/api/scripts/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadScripts();
        }
    </script>
</body>
</html>
